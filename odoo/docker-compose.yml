
services:
  db:
    image: postgres:16
    container_name: odoo18-db
    environment:
      POSTGRES_USER: odoo18
      POSTGRES_PASSWORD: odoo18
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo18 -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  odoo18:
    image: odoo:18.0
    container_name: odoo18
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo18
      PASSWORD: odoo18
    volumes:
      # Configuración
      - ./odoo:/etc/odoo

      # Modulos de odoo
      - ./addons:/mnt/odoo-addons

      # Módulos personalizados que crearemos
      - ./extra_addons:/mnt/extra-addons

      # Datos internos de Odoo
      - odoo18-data:/var/lib/odoo

    command: >
      odoo
      --config=/etc/odoo/odoo.conf
      --dev=all

    restart: always

volumes:
  odoo18-data:
